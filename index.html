<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비전파인더 상담 예약</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --blue: #2563EB; --blue-dark: #1D4ED8; --blue-light: #EFF6FF; --blue-mid: #BFDBFE;
      --green: #059669; --green-light: #ECFDF5; --green-mid: #A7F3D0;
      --red: #DC2626; --red-light: #FEF2F2;
      --yellow-light: #FFFBEB; --yellow-mid: #FDE68A;
      --bg: #F0F4FF; --surface: #FFFFFF; --border: #E2E8F0;
      --text: #0F172A; --text-mid: #475569; --text-muted: #94A3B8;
      --shadow: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --radius: 14px; --radius-sm: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; margin: 0; font-size: 15px; line-height: 1.5; }
    a { color: var(--blue); text-decoration: none; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px 60px; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 100; }
    .header-brand { font-weight: 800; font-size: 17px; color: var(--blue); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-chip { display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 20px; padding: 4px 12px 4px 4px; font-size: 13px; color: var(--text-mid); }
    .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--text-mid); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
    .btn-logout:hover { background: var(--bg); }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--surface); border-radius: 24px; padding: 52px 40px 44px; text-align: center; box-shadow: var(--shadow-md); max-width: 400px; width: 100%; }
    .login-emoji { font-size: 44px; margin-bottom: 14px; }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; line-height: 1.7; }
    .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 20px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text); font-family: inherit; transition: all 0.18s; }
    .btn-google:hover { background: var(--bg); border-color: var(--blue-mid); box-shadow: var(--shadow-md); }
    .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .tab { flex: 1; padding: 9px 8px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-mid); border: none; background: none; font-family: inherit; transition: all 0.18s; }
    .tab.active { background: var(--blue); color: #fff; }
    .tab:hover:not(.active) { background: var(--bg); color: var(--text); }
    .card { background: var(--surface); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-weight: 700; font-size: 16px; }
    .section-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 400; }
    .slot-item { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; transition: all 0.18s; background: var(--surface); }
    .slot-item:hover { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
    .slot-item.is-mine { border-color: var(--green); background: var(--green-light); }
    .slot-item.is-taken { border-color: var(--border); opacity: 0.55; }
    .slot-time-label { font-weight: 700; font-size: 17px; }
    .slot-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .date-header { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.4px; margin: 20px 0 8px; }
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge-blue { background: var(--blue-light); color: var(--blue); }
    .badge-green { background: var(--green-light); color: var(--green); }
    .badge-gray { background: var(--bg); color: var(--text-muted); }
    .badge-orange { background: #FFF7ED; color: #C2410C; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: all 0.18s; white-space: nowrap; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-secondary { background: var(--bg); color: var(--text-mid); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--red-light); color: var(--red); }
    .btn-danger:hover { background: #FECACA; }
    .btn-full { width: 100%; }
    .btn-sm { padding: 5px 12px; font-size: 13px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 5px; }
    .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; color: var(--text); background: var(--surface); transition: border-color 0.18s; }
    .form-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    .modal { background: var(--surface); border-radius: 20px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
    .alert { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
    .alert-blue { background: var(--blue-light); color: #1E40AF; border: 1px solid var(--blue-mid); }
    .alert-green { background: var(--green-light); color: #065F46; border: 1px solid var(--green-mid); }
    .alert-yellow { background: var(--yellow-light); color: #92400E; border: 1px solid var(--yellow-mid); }
    .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bg); }
    .list-row:last-child { border-bottom: none; }
    .row-name { font-weight: 600; font-size: 15px; }
    .row-sub { font-size: 13px; color: var(--text-muted); margin-top: 1px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .confirmed-card { text-align: center; padding: 12px 0 28px; }
    .confirmed-icon { font-size: 52px; margin-bottom: 12px; }
    .confirmed-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .confirmed-sub { color: var(--text-muted); font-size: 14px; }
    .info-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; }
    .info-row + .info-row { border-top: 1px solid var(--bg); }
    .info-icon { font-size: 26px; flex-shrink: 0; }
    .info-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .info-value { font-weight: 700; font-size: 17px; }
    .info-value-sm { font-weight: 600; font-size: 15px; color: var(--blue); }
    .denied { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .divider { height: 1px; background: var(--bg); margin: 16px 0; }
    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(0); background: #0F172A; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 999; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; color: var(--text-muted); font-size: 14px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .login-card { padding: 36px 24px 32px; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div>로딩 중…</div></div>
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  ⚙️ 설정값
// ══════════════════════════════════════════════════
var CONFIG = {
  firebase: {
    apiKey:            "AIzaSyDi4JM2tX9UGLctUYdBlocIdYAhOF4GSQg",
    authDomain:        "vffullcaresystem.firebaseapp.com",
    projectId:         "vffullcaresystem",
    storageBucket:     "vffullcaresystem.firebasestorage.app",
    messagingSenderId: "744998625393",
    appId:             "1:744998625393:web:4afc6da7a096eee9e0bbd0"
  },
  adminEmail:   "vfmedicalschool@gmail.com",
  kakaoWebhook: "",
  brandName:    "비전파인더"
};

// ══════════════════════════════════════════════════
//  Firebase 초기화
// ══════════════════════════════════════════════════
firebase.initializeApp(CONFIG.firebase);
var auth = firebase.auth();
var db   = firebase.firestore();
var googleProvider = new firebase.auth.GoogleAuthProvider();

// ══════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════
var S = {
  user: null, isAdmin: false, isAllowed: false, loading: true,
  tab: "slots",
  slots: [], students: [], bookings: [], myBooking: null,
  modalSlot: false, modalStudent: false, modalConfirm: null
};

// ══════════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════════
var DAYS = ["일","월","화","수","목","금","토"];
function fmtDate(d) {
  var dt = new Date(d + "T00:00:00");
  return (dt.getMonth()+1) + "월 " + dt.getDate() + "일 (" + DAYS[dt.getDay()] + ")";
}

var _toastTimer;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2800);
}

function notifyKakao(msg) {
  if (!CONFIG.kakaoWebhook) return;
  fetch(CONFIG.kakaoWebhook, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ text: msg }) }).catch(function(){});
}

function groupByDate(arr) {
  return arr.reduce(function(acc, s){ (acc[s.date] = acc[s.date] || []).push(s); return acc; }, {});
}

function bookingForSlot(slotId) {
  return S.bookings.find(function(b){ return b.slotId === slotId; }) || null;
}

// ══════════════════════════════════════════════════
//  Firestore CRUD
// ══════════════════════════════════════════════════
function loadAll() {
  return Promise.all([
    db.collection("slots").orderBy("date").orderBy("time").get().then(function(snap){
      S.slots = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    }),
    db.collection("bookings").where("status","==","active").get().then(function(snap){
      S.bookings = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      if (S.user) S.myBooking = S.bookings.find(function(b){ return b.studentEmail === S.user.email; }) || null;
    })
  ]);
}

function loadStudents() {
  return db.collection("students").orderBy("name").get().then(function(snap){
    S.students = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
  });
}

function isStudentAllowed(email) {
  return db.collection("students").doc(email.toLowerCase()).get().then(function(snap){ return snap.exists; });
}

function addSlot(date, time, meetLink) {
  if (S.slots.some(function(s){ return s.date === date && s.time === time; })) {
    toast("같은 날짜·시간의 슬롯이 이미 있어요."); return Promise.resolve();
  }
  return db.collection("slots").add({ date: date, time: time, meetLink: meetLink||"", createdAt: firebase.firestore.Timestamp.now() })
    .then(function(){ return loadAll(); }).then(function(){ toast("슬롯이 추가됐어요!"); render(); })
    .catch(function(e){ console.error(e); toast("저장 실패: " + e.message); render(); });
}

function delSlot(id) {
  if (bookingForSlot(id)) { toast("예약된 슬롯은 삭제할 수 없어요. 먼저 예약을 취소하세요."); return Promise.resolve(); }
  return db.collection("slots").doc(id).delete()
    .then(function(){ return loadAll(); }).then(function(){ toast("삭제됐어요."); render(); });
}

function addStudent(name, email) {
  email = email.toLowerCase();
  return db.collection("students").doc(email).set({ name: name, email: email, addedAt: firebase.firestore.Timestamp.now() })
    .then(function(){ return loadStudents(); }).then(function(){ toast(name + " 학생이 등록됐어요!"); render(); });
}

function delStudent(email) {
  return db.collection("students").doc(email).delete()
    .then(function(){ return loadStudents(); }).then(function(){ toast("삭제됐어요."); render(); });
}

function bookSlot(slot) {
  if (S.myBooking) { toast("이미 예약된 상담이 있어요. 기존 예약을 취소 후 다시 신청해주세요."); return; }
  if (bookingForSlot(slot.id)) { toast("방금 다른 학생이 예약했어요. 다른 시간을 선택해주세요."); loadAll().then(render); return; }
  var student = S.students.find(function(s){ return s.email === S.user.email; });
  var name = student ? student.name : (S.user.displayName || "");
  db.collection("bookings").add({
    slotId: slot.id, slotDate: slot.date, slotTime: slot.time,
    studentEmail: S.user.email, studentName: name,
    status: "active", bookedAt: firebase.firestore.Timestamp.now()
  }).then(function(){
    notifyKakao("📅 [" + CONFIG.brandName + "] 상담 예약 알림\n\n학생: " + name + "\n일정: " + fmtDate(slot.date) + " " + slot.time);
    return loadAll();
  }).then(function(){ S.tab = "mine"; toast("예약 완료! 🎉"); render(); });
}

function cancelBooking(id, isAdminAction) {
  db.collection("bookings").doc(id).update({ status: "cancelled" }).then(function(){
    return loadAll();
  }).then(function(){ toast("예약이 취소됐어요."); if (!isAdminAction) S.tab = "available"; render(); });
}

// ══════════════════════════════════════════════════
//  Render
// ══════════════════════════════════════════════════
function render() {
  var root = document.getElementById("root");
  if (S.loading) { root.innerHTML = '<div class="loading"><div class="spinner"></div>로딩 중…</div>'; return; }
  if (!S.user)   { root.innerHTML = renderLogin(); bindLogin(); return; }
  if (!S.isAllowed) { root.innerHTML = renderHeader() + renderDenied(); bindLogout(); return; }
  root.innerHTML = renderHeader()
    + '<div class="container">'
    + (S.isAdmin ? renderAdmin() : renderStudent())
    + '</div>'
    + (S.modalSlot    ? renderModalSlot()    : "")
    + (S.modalStudent ? renderModalStudent() : "")
    + (S.modalConfirm ? renderModalConfirm() : "");
  bindAll();
}

function renderHeader() {
  var initial = ((S.user && (S.user.displayName || S.user.email)) || "?")[0].toUpperCase();
  return '<div class="header">'
    + '<div class="header-brand">📅 ' + CONFIG.brandName + ' 상담 예약</div>'
    + '<div class="header-right">'
    + (S.isAdmin ? '<span class="badge badge-orange">관리자</span>' : "")
    + '<div class="user-chip"><div class="user-avatar">' + initial + '</div><span>' + (S.user ? (S.user.displayName || S.user.email) : "") + '</span></div>'
    + '<button class="btn-logout" id="btn-logout">로그아웃</button>'
    + '</div></div>';
}

function renderLogin() {
  return '<div class="login-wrap"><div class="login-card">'
    + '<div class="login-emoji">📅</div>'
    + '<div class="login-title">' + CONFIG.brandName + ' 상담 예약</div>'
    + '<div class="login-sub">구글 계정으로 로그인하면<br>상담 일정을 확인하고 바로 예약할 수 있어요.</div>'
    + '<button class="btn-google" id="btn-google">'
    + '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>'
    + 'Google 계정으로 로그인</button>'
    + '</div></div>';
}

function renderDenied() {
  return '<div class="denied">'
    + '<div style="font-size:52px;margin-bottom:16px">🔒</div>'
    + '<h2 style="font-size:20px;font-weight:800;margin-bottom:8px">접근 권한이 없어요</h2>'
    + '<p style="color:var(--text-mid);font-size:14px;line-height:1.7">등록된 학생만 예약 시스템을 이용할 수 있어요.<br>선생님께 등록 요청을 해주세요.</p>'
    + '<div style="margin-top:16px;color:var(--text-muted);font-size:13px;background:var(--bg);padding:6px 14px;border-radius:20px">' + (S.user ? S.user.email : "") + '</div>'
    + '</div>';
}

// ── Admin ───────────────────────────────────────
function renderAdmin() {
  var tabs = [{id:"slots",label:"슬롯 관리"},{id:"students",label:"학생 등록"},{id:"bookings",label:"예약 현황"}];
  return '<div style="padding-top:20px">'
    + '<div class="tabs">' + tabs.map(function(t){ return '<button class="tab' + (S.tab===t.id?" active":"") + '" data-tab="' + t.id + '">' + t.label + '</button>'; }).join("") + '</div>'
    + (S.tab==="slots" ? renderAdminSlots() : S.tab==="students" ? renderAdminStudents() : renderAdminBookings())
    + '</div>';
}

function renderAdminSlots() {
  var g = groupByDate(S.slots);
  var html = '<div class="card"><div class="card-header"><div><div class="card-title">상담 슬롯 목록</div><div class="section-sub">' + S.slots.length + '개 등록됨</div></div><button class="btn btn-primary btn-sm" id="btn-open-slot-modal">+ 슬롯 추가</button></div>';
  if (!S.slots.length) {
    html += '<div class="empty"><div class="empty-icon">📭</div><p>등록된 슬롯이 없어요.<br>+ 슬롯 추가를 눌러 일정을 만들어보세요.</p></div>';
  } else {
    Object.keys(g).forEach(function(date){
      html += '<div class="date-header">' + fmtDate(date) + '</div>';
      g[date].forEach(function(slot){
        var bk = bookingForSlot(slot.id);
        html += '<div class="slot-item' + (bk?" is-mine":"") + '">'
          + '<div><div class="slot-time-label">' + slot.time + '</div>'
          + (bk ? '<div style="font-size:14px;margin-top:4px">👤 ' + (bk.studentName||bk.studentEmail) + '</div>' : '<div class="slot-meta">예약 가능</div>')
          + (slot.meetLink ? '<a href="' + slot.meetLink + '" target="_blank" style="font-size:13px">📹 Meet 링크</a>' : '')
          + '</div><div style="display:flex;align-items:center;gap:8px">'
          + (bk ? '<span class="badge badge-green">예약됨</span>' : '<span class="badge badge-blue">비어있음</span>')
          + '<button class="btn btn-danger btn-sm" data-del-slot="' + slot.id + '">삭제</button></div></div>';
      });
    });
  }
  return html + '</div>';
}

function renderAdminStudents() {
  var html = '<div class="card"><div class="card-header"><div><div class="card-title">등록 학생 목록</div><div class="section-sub">' + S.students.length + '명 등록됨</div></div><button class="btn btn-primary btn-sm" id="btn-open-student-modal">+ 학생 추가</button></div>';
  if (!S.students.length) {
    html += '<div class="empty"><div class="empty-icon">👥</div><p>등록된 학생이 없어요.</p></div>';
  } else {
    S.students.forEach(function(s){
      html += '<div class="list-row"><div><div class="row-name">' + s.name + '</div><div class="row-sub">' + s.email + '</div></div><button class="btn btn-danger btn-sm" data-del-student="' + s.email + '">삭제</button></div>';
    });
  }
  return html + '</div>';
}

function renderAdminBookings() {
  var sorted = S.bookings.slice().sort(function(a,b){ return (a.slotDate+a.slotTime).localeCompare(b.slotDate+b.slotTime); });
  var html = '<div class="card"><div class="card-header"><div><div class="card-title">예약 현황</div><div class="section-sub">' + S.bookings.length + '건</div></div></div>';
  if (!sorted.length) {
    html += '<div class="empty"><div class="empty-icon">📋</div><p>아직 예약된 상담이 없어요.</p></div>';
  } else {
    sorted.forEach(function(b){
      var slot = S.slots.find(function(s){ return s.id === b.slotId; });
      html += '<div class="list-row"><div>'
        + '<div class="row-name">' + (b.studentName||"(이름 없음)") + '</div>'
        + '<div class="row-sub">' + b.studentEmail + '</div>'
        + '<div style="font-size:13px;color:var(--blue);margin-top:2px">' + fmtDate(b.slotDate) + ' ' + b.slotTime + '</div>'
        + (slot && slot.meetLink ? '<a href="' + slot.meetLink + '" target="_blank" style="font-size:13px">📹 Meet 링크</a>' : '')
        + '</div><button class="btn btn-danger btn-sm" data-cancel-booking="' + b.id + '">취소</button></div>';
    });
  }
  return html + '</div>';
}

// ── Student ─────────────────────────────────────
function renderStudent() {
  var tabs = [{id:"available",label:"📅 상담 예약"},{id:"mine",label:"✅ 내 예약"}];
  return '<div style="padding-top:20px">'
    + '<div class="tabs">' + tabs.map(function(t){ return '<button class="tab' + (S.tab===t.id?" active":"") + '" data-tab="' + t.id + '">' + t.label + '</button>'; }).join("") + '</div>'
    + (S.tab==="available" ? renderStudentAvailable() : renderStudentMine())
    + '</div>';
}

function renderStudentAvailable() {
  var g = groupByDate(S.slots);
  var html = '<div class="card">'
    + (S.myBooking ? '<div class="alert alert-green">✅ 이미 예약된 상담이 있어요. <b>내 예약</b> 탭에서 확인하세요.</div>'
                   : '<div class="alert alert-blue">💡 원하는 시간을 선택해 예약하세요. 상담은 Google Meet으로 진행돼요.</div>');
  if (!S.slots.length) {
    html += '<div class="empty"><div class="empty-icon">📭</div><p>현재 예약 가능한 슬롯이 없어요.<br>선생님이 일정을 열면 바로 확인할 수 있어요.</p></div>';
  } else {
    Object.keys(g).forEach(function(date){
      html += '<div class="date-header">' + fmtDate(date) + '</div>';
      g[date].forEach(function(slot){
        var bk = bookingForSlot(slot.id);
        var isMe = bk && bk.studentEmail === S.user.email;
        var isFull = !!bk && !isMe;
        html += '<div class="slot-item' + (isMe?" is-mine":"") + (isFull?" is-taken":"") + '">'
          + '<div><div class="slot-time-label">' + slot.time + '</div>'
          + '<div class="slot-meta">' + (isFull?"마감":isMe?"내 예약 ✅":"예약 가능") + '</div></div>'
          + '<div>'
          + (isMe   ? '<span class="badge badge-green">예약됨</span>'
           : isFull ? '<span class="badge badge-gray">마감</span>'
           : !S.myBooking ? '<button class="btn btn-primary btn-sm" data-book="' + slot.id + '" data-book-date="' + slot.date + '" data-book-time="' + slot.time + '">예약하기</button>'
                          : '<span class="badge badge-blue">예약 가능</span>')
          + '</div></div>';
      });
    });
  }
  return html + '</div>';
}

function renderStudentMine() {
  if (!S.myBooking) {
    return '<div class="card"><div class="empty"><div class="empty-icon">📅</div><p>아직 예약된 상담이 없어요.<br><b>상담 예약</b> 탭에서 원하는 시간을 선택해주세요.</p></div></div>';
  }
  var b = S.myBooking;
  var slot = S.slots.find(function(s){ return s.id === b.slotId; });
  return '<div class="card">'
    + '<div class="confirmed-card"><div class="confirmed-icon">✅</div><div class="confirmed-title">상담 예약 완료</div><div class="confirmed-sub">아래 일정을 확인하고 Google Meet을 준비하세요.</div></div>'
    + '<div class="divider"></div>'
    + '<div class="info-row"><div class="info-icon">📅</div><div><div class="info-label">상담 일정</div><div class="info-value">' + fmtDate(b.slotDate) + '</div><div style="font-size:18px;font-weight:700;color:var(--blue)">' + b.slotTime + '</div></div></div>'
    + '<div class="info-row"><div class="info-icon">📹</div><div><div class="info-label">Google Meet</div>'
    + (slot && slot.meetLink ? '<a href="' + slot.meetLink + '" target="_blank" class="info-value-sm">화상 상담 링크 열기 →</a>'
                             : '<div style="font-size:14px;color:var(--text-muted)">링크는 상담 전에 선생님이 추가해 주실 예정이에요.</div>')
    + '</div></div>'
    + '<div class="divider"></div>'
    + '<div class="alert alert-yellow" style="margin-top:14px">📌 카메라 <b>On</b> 필수! Google Meet 앱 설치 + 마이크 테스트 미리 해주세요.</div>'
    + '<button class="btn btn-danger btn-full" id="btn-cancel-mine" style="margin-top:14px">예약 취소</button>'
    + '</div>';
}

// ── Modals ───────────────────────────────────────
function renderModalSlot() {
  var today = new Date().toISOString().split("T")[0];
  return '<div class="overlay" id="overlay"><div class="modal">'
    + '<div class="modal-title">📅 슬롯 추가</div>'
    + '<div class="form-row"><div class="form-group"><label class="form-label">날짜</label><input type="date" class="form-input" id="f-date" min="' + today + '"></div>'
    + '<div class="form-group"><label class="form-label">시간</label><input type="time" class="form-input" id="f-time"></div></div>'
    + '<div class="form-group"><label class="form-label">Google Meet 링크 <span style="color:var(--text-muted);font-weight:400">(선택)</span></label><input type="url" class="form-input" id="f-meet" placeholder="https://meet.google.com/..."></div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" id="btn-close-slot-modal">취소</button><button class="btn btn-primary" id="btn-do-add-slot">추가하기</button></div>'
    + '</div></div>';
}

function renderModalStudent() {
  return '<div class="overlay" id="overlay"><div class="modal">'
    + '<div class="modal-title">👤 학생 등록</div>'
    + '<div class="form-group"><label class="form-label">이름</label><input type="text" class="form-input" id="f-name" placeholder="홍길동"></div>'
    + '<div class="form-group"><label class="form-label">구글 계정 이메일</label><input type="email" class="form-input" id="f-email" placeholder="student@gmail.com"></div>'
    + '<div class="modal-actions"><button class="btn btn-secondary" id="btn-close-student-modal">취소</button><button class="btn btn-primary" id="btn-do-add-student">등록하기</button></div>'
    + '</div></div>';
}

function renderModalConfirm() {
  return '<div class="overlay" id="overlay-confirm"><div class="modal" style="max-width:360px;text-align:center">'
    + '<div style="font-size:40px;margin-bottom:12px">🤔</div>'
    + '<div class="modal-title" style="text-align:center">' + S.modalConfirm.title + '</div>'
    + '<div style="font-size:14px;color:var(--text-mid)">' + S.modalConfirm.body + '</div>'
    + '<div class="modal-actions" style="justify-content:center;margin-top:20px"><button class="btn btn-secondary" id="btn-confirm-no">아니요</button><button class="btn btn-danger" id="btn-confirm-yes">네, 진행할게요</button></div>'
    + '</div></div>';
}

function confirm2(title, body, onConfirm) {
  S.modalConfirm = { title: title, body: body, onConfirm: onConfirm };
  render();
}

// ══════════════════════════════════════════════════
//  Event Binding
// ══════════════════════════════════════════════════
function doLogin(user) {
  S.user = user;
  S.loading = false;
  S.isAdmin = user.email.toLowerCase() === CONFIG.adminEmail.toLowerCase();
  if (S.isAdmin) {
    S.isAllowed = true; S.tab = "slots";
    render();
    Promise.all([loadAll(), loadStudents()]).then(render).catch(function(e){ console.error(e); render(); });
  } else {
    isStudentAllowed(user.email).then(function(ok){
      S.isAllowed = ok;
      if (ok) { S.tab = "available"; render(); loadAll().then(render).catch(function(){ render(); }); }
      else render();
    }).catch(function(){ S.isAllowed = false; render(); });
  }
}

function bindLogin() {
  var btn = document.getElementById("btn-google");
  if (btn) btn.onclick = function(){
    auth.signInWithPopup(googleProvider).then(function(result){
      doLogin(result.user);
    }).catch(function(e){ toast("로그인 실패: " + e.message); });
  };
}

function bindLogout() {
  var btn = document.getElementById("btn-logout");
  if (btn) btn.onclick = function(){ auth.signOut(); };
}

function bindAll() {
  bindLogout();

  document.querySelectorAll("[data-tab]").forEach(function(el){
    el.onclick = function(){ S.tab = el.dataset.tab; render(); };
  });

  var ov = document.getElementById("overlay");
  if (ov) ov.onclick = function(e){ if(e.target.id==="overlay"){ S.modalSlot=false; S.modalStudent=false; render(); }};
  var ovc = document.getElementById("overlay-confirm");
  if (ovc) ovc.onclick = function(e){ if(e.target.id==="overlay-confirm"){ S.modalConfirm=null; render(); }};

  // Admin: slot modal
  var bos = document.getElementById("btn-open-slot-modal");
  if (bos) bos.onclick = function(){ S.modalSlot=true; render(); };
  var bcs = document.getElementById("btn-close-slot-modal");
  if (bcs) bcs.onclick = function(){ S.modalSlot=false; render(); };
  var bdas = document.getElementById("btn-do-add-slot");
  if (bdas) bdas.onclick = function(){
    var date = document.getElementById("f-date").value;
    var time = document.getElementById("f-time").value;
    var meet = document.getElementById("f-meet").value;
    if (!date||!time){ toast("날짜와 시간을 모두 입력해주세요."); return; }
    S.modalSlot=false; render(); addSlot(date,time,meet);
  };

  document.querySelectorAll("[data-del-slot]").forEach(function(el){
    el.onclick = function(){ confirm2("슬롯 삭제","이 슬롯을 삭제할까요?", function(){ delSlot(el.dataset.delSlot); }); };
  });

  // Admin: student modal
  var bost = document.getElementById("btn-open-student-modal");
  if (bost) bost.onclick = function(){ S.modalStudent=true; render(); };
  var bcst = document.getElementById("btn-close-student-modal");
  if (bcst) bcst.onclick = function(){ S.modalStudent=false; render(); };
  var bdast = document.getElementById("btn-do-add-student");
  if (bdast) bdast.onclick = function(){
    var name = document.getElementById("f-name").value.trim();
    var email = document.getElementById("f-email").value.trim();
    if (!name||!email){ toast("이름과 이메일을 모두 입력해주세요."); return; }
    S.modalStudent=false; addStudent(name,email);
  };

  document.querySelectorAll("[data-del-student]").forEach(function(el){
    el.onclick = function(){ confirm2("학생 삭제", el.dataset.delStudent + " 를 삭제할까요?", function(){ delStudent(el.dataset.delStudent); }); };
  });

  document.querySelectorAll("[data-cancel-booking]").forEach(function(el){
    el.onclick = function(){ confirm2("예약 취소","이 예약을 취소할까요?", function(){ cancelBooking(el.dataset.cancelBooking, true); }); };
  });

  // Student: book
  document.querySelectorAll("[data-book]").forEach(function(el){
    el.onclick = function(){
      var slot = S.slots.find(function(s){ return s.id === el.dataset.book; });
      if (!slot) return;
      confirm2("상담 예약", fmtDate(el.dataset.bookDate) + " " + el.dataset.bookTime + "<br>이 시간으로 예약할까요?", function(){ bookSlot(slot); });
    };
  });

  // Student: cancel
  var bcm = document.getElementById("btn-cancel-mine");
  if (bcm) bcm.onclick = function(){ confirm2("예약 취소","정말 예약을 취소할까요?", function(){ cancelBooking(S.myBooking.id, false); }); };

  // Confirm modal
  var cno = document.getElementById("btn-confirm-no");
  if (cno) cno.onclick = function(){ S.modalConfirm=null; render(); };
  var cyes = document.getElementById("btn-confirm-yes");
  if (cyes) cyes.onclick = function(){
    var fn = S.modalConfirm && S.modalConfirm.onConfirm;
    S.modalConfirm=null; render(); if(fn) fn();
  };
}

// ══════════════════════════════════════════════════
//  Auth State
// ══════════════════════════════════════════════════
auth.onAuthStateChanged(function(user){
  S.loading = false;
  S.user = user;
  if (!user) { S.isAdmin=false; S.isAllowed=false; render(); return; }
  S.isAdmin = user.email.toLowerCase() === CONFIG.adminEmail.toLowerCase();
  if (S.isAdmin) {
    S.isAllowed = true; S.tab = "slots";
    render();
    Promise.all([loadAll(), loadStudents()]).then(render).catch(function(e){ console.error(e); toast("Firestore 오류: " + e.message); render(); });
  } else {
    isStudentAllowed(user.email).then(function(ok){
      S.isAllowed = ok;
      if (ok) { S.tab="available"; render(); loadAll().then(render).catch(function(e){ console.error(e); render(); }); }
      else render();
    }).catch(function(e){ console.error(e); S.isAllowed=false; render(); });
  }
});

render();
</script>
</body>
</html>
